name: Optional MCP Trust Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  mcp-trust:
    name: Surface Risk Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MCP Trust Kit
        uses: aak204/MCP-Trust-Kit@v0.4.0
        with:
          cmd: python local-domain-checker.py
          sarif-out: mcp-trust-report.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mcp-trust-report.sarif
